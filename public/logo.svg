<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED58E"/>
      <stop offset="35%" stop-color="#C5A059"/>
      <stop offset="70%" stop-color="#E3C475"/>
      <stop offset="100%" stop-color="#9C7732"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Emblem Icon on Left -->
  <g transform="translate(60, 60)" filter="url(#subtleGlow)">
    <!-- Outer Ornamental Laurel Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="38" fill="#0C2017" stroke="url(#goldGrad)" stroke-width="1.2"/>
    
    <!-- Lotus / Botanical Petals -->
    <path d="M 0,-24 C -6,-12 -12,-2 0,14 C 12,-2 6,-12 0,-24 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M -8,-18 C -18,-10 -18,2 -3,12 C -6,2 -10,-8 -8,-18 Z" fill="url(#goldGrad)" opacity="0.75"/>
    <path d="M 8,-18 C 18,-10 18,2 3,12 C 6,2 10,-8 8,-18 Z" fill="url(#goldGrad)" opacity="0.75"/>
    
    <!-- Stylized AM Center Monogram -->
    <text x="0" y="24" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="13" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">AM</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 0)">
    <text x="0" y="48" font-family="'Cinzel', 'Playfair Display', 'Bodoni MT', serif" font-size="13" font-weight="600" fill="url(#goldGrad)" letter-spacing="4">AYURVEDA &amp; BOTANICALS</text>
    <text x="0" y="78" font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="2">SOUL MATE</text>
    <text x="0" y="98" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#A8C4B4" letter-spacing="4.5">ORGANIC HERBAL LUXURY</text>
  </g>
</svg>
